
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # 限制仅开放必需的登录与扫码反向代理路径，剥离 Cookie/Authorization
    location ^~ /api/hortor-ucenter/ucenter-app-server/api/v1/login/ {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        rewrite ^/api/hortor-ucenter(/.*)$ $1 break;
        proxy_pass https://comb-platform.hortorgames.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Host ucenter-app-server.hortorgames.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; ALN-AL80 Build/HUAWEIALN-AL80; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/114.0.5735.196 Mobile Safari/537.36";
        proxy_set_header Accept "application/json";
        proxy_set_header Content-Type "application/json; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/hortor-ucenter/ {
        return 403;
    }

    location ^~ /api/weixin-long/connect/l/qrconnect {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        rewrite ^/api/weixin-long(/.*)$ $1 break;
        proxy_pass https://long.open.weixin.qq.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_set_header Host long.open.weixin.qq.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "*/*";
        proxy_set_header Referer "https://open.weixin.qq.com/";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/weixin-long/ {
        return 403;
    }

    location ^~ /api/weixin/connect/app/qrconnect {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        rewrite ^/api/weixin(/.*)$ $1 break;
        proxy_pass https://open.weixin.qq.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Host open.weixin.qq.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        proxy_set_header Referer "https://open.weixin.qq.com/";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/weixin/connect/l/qrconnect {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        rewrite ^/api/weixin(/.*)$ $1 break;
        proxy_pass https://open.weixin.qq.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Host open.weixin.qq.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        proxy_set_header Referer "https://open.weixin.qq.com/";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/weixin/ {
        return 403;
    }

    location = /api/hortor/comb-login-server/api/v1/login {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        rewrite ^/api/hortor(/.*)$ $1 break;
        proxy_pass https://comb-platform.hortorgames.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Host comb-platform.hortorgames.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; 23117RK66C Build/V417IR; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/95.0.4638.74 Mobile Safari/537.36";
        proxy_set_header Accept "*/*";
        proxy_set_header Content-Type "text/plain; charset=utf-8";
        proxy_set_header Origin "https://open.weixin.qq.com";
        proxy_set_header Referer "https://open.weixin.qq.com/";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/hortor/ {
        return 403;
    }

    location / {
        root   /app/web;
        try_files $uri $uri/ /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root    /app/web;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

